[project]
name = "sts1-llm-policy"
version = "0.1.0"
description = "A small post-training research project for finite-action combat policies in Slay the Spire 1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "lllldj" }
]
requires-python = ">=3.11"
dependencies = [
    "packaging>=20",
    "torch==2.12.1",
    "transformers==4.57.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"
